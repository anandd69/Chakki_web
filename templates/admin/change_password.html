{% extends "admin/base.html" %}
{% block title %}Change Password{% endblock %}
{% block page_title %}Change Admin Password{% endblock %}
{% block admin_content %}
<div style="max-width:480px">
  {% if error %}
  <div
    style="background:rgba(192,57,43,0.15);border:1px solid rgba(192,57,43,0.3);color:#e74c3c;border-radius:8px;padding:0.75rem 1rem;margin-bottom:1.2rem;">
    {{ error }}</div>
  {% endif %}
  <div class="card">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Current Password</label>
        <input type="password" name="current_password" required autocomplete="current-password">
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" name="new_password" required minlength="6" autocomplete="new-password">
        <div class="form-hint">Minimum 6 characters</div>
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" name="confirm_password" required autocomplete="new-password">
      </div>
      <div style="display:flex;gap:1rem;margin-top:1rem">
        <button type="submit" class="btn btn-gold">Change Password</button>
        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
